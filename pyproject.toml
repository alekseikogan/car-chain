[project]
name = "car-chain"
version = "0.1.0"
description = "langchain learn"
authors = [
    {name = "Алексей",email = "alekseikogan@yandex.ru"}
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "langchain-core (>=1.7.0,<2.0.0)",
    "langchain-openai (>=1.7.2,<2.0.0)",
    "langchain (>=1.4.7,<2.0.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "pydantic (>=2.14.1,<3.0.0)",
    "langchain-text-splitters (>=1.1.3,<2.0.0)",
    "numpy (>=2.5.4,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
